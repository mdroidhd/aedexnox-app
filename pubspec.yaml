publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: 6.2.0-beta.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
